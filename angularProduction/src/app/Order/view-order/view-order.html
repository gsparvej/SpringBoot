<div class="container mt-5">
  <div class="d-flex justify-content-between align-items-center mb-3">
    <h3 class="text-primary">📋 Order List</h3>
    <button class="btn btn-success" (click)="addOrder()">
      <i class="fa fa-plus me-2"></i> Add Order
    </button>
  </div>

  <div *ngIf="loading" class="text-center my-5">
    <div class="spinner-border text-primary"></div>
    <p>Loading orders...</p>
  </div>

  <table class="table table-bordered table-hover shadow-sm" *ngIf="!loading && orders.length > 0">
    <thead class="table-dark text-center">
      <tr>
        <th>ID</th>
        <th>PO Number</th>
        <th>Buyer</th>
        <th>Style</th>
        <th>Quantity</th>
        <th>Delivery Date</th>
        <th>Actions</th>
      </tr>
    </thead>
    <tbody class="text-center align-middle">
      <tr *ngFor="let order of orders">
        <td>{{ order.id }}</td>
        <td>{{ order.poNumber }}</td>
        <td>{{ order.buyerName }}</td>
        <td>{{ order.styleName }}</td>
        <td>{{ order.orderQuantity }}</td>
        <td>{{ order.deliveryDate | date }}</td>
        <td>
          <button class="btn btn-sm btn-info me-2">
            <i class="fa fa-eye"></i>
          </button>
          <button class="btn btn-sm btn-danger" (click)="deleteOrder(order.id)">
            <i class="fa fa-trash"></i>
          </button>
        </td>
      </tr>
    </tbody>
  </table>

  <div *ngIf="!loading && orders.length === 0" class="alert alert-warning text-center">
    No orders found.
  </div>
</div>
